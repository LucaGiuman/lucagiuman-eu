<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Leggi — Luca Giuman</title>
  <meta name="description" id="page-desc" content="Leggi l'opera di Luca Giuman.">
  <link rel="canonical" id="page-canonical" href="https://lucagiuman.eu/leggi.html">
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0a; color: #f0ece4; font-family: Inter, system-ui, sans-serif; overflow: hidden; }

    #reader-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: #111;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      gap: 1rem;
    }
    #reader-header .btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f0ece4;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #reader-header .btn:hover { background: rgba(255,255,255,0.13); }
    #reader-title {
      flex: 1;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.85;
    }

    #pdf-container {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
    }
    #pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #pdf-fallback {
      display: none;
      padding: 3rem 2rem;
      text-align: center;
      line-height: 1.7;
      color: rgba(240,236,228,0.7);
    }
    #pdf-fallback a { color: #f0ece4; }
  </style>
</head>
<body>

<header id="reader-header">
  <a id="btn-back" class="btn" href="/">← Opere</a>
  <span id="reader-title">Caricamento…</span>
  <a id="btn-download" class="btn" href="#" download>↓ Scarica</a>
</header>

<div id="pdf-container">
  <iframe id="pdf-frame" src="" title="PDF" allowfullscreen></iframe>
  <div id="pdf-fallback">
    <p>Il PDF non si carica nel browser.<br>
    <a id="fallback-link" href="#">Apri direttamente il PDF ↗</a></p>
  </div>
</div>

<script>
(function() {
  const opere = {
    'libro-versione-1': {
      pdf: '/pdf/libro-versione-1.pdf',
      titolo: 'Quando la tecnologia smette di essere uno strumento',
      filename: 'luca-giuman-quando-la-tecnologia.pdf'
    },
    'forza-ambiente-liberta': {
      pdf: '/pdf/forza-ambiente-liberta.pdf',
      titolo: 'Forza, Ambiente, Libertà',
      filename: 'luca-giuman-forza-ambiente-liberta.pdf'
    }
  };

  const params = new URLSearchParams(location.search);
  const slug = params.get('opera');
  const opera = opere[slug];

  if (!opera) {
    location.href = '/';
    return;
  }

  // Title & meta
  const titolo = opera.titolo;
  document.getElementById('page-title').textContent = titolo + ' — Luca Giuman';
  document.getElementById('page-desc').content = titolo + ' di Luca Giuman.';
  document.getElementById('reader-title').textContent = titolo;

  // Back button
  const btnBack = document.getElementById('btn-back');
  btnBack.addEventListener('click', function(e) {
    e.preventDefault();
    const ref = document.referrer;
    if (ref && new URL(ref).origin === location.origin) {
      history.back();
    } else {
      location.href = '/#opere';
    }
  });

  // Download
  const btnDownload = document.getElementById('btn-download');
  btnDownload.href = opera.pdf;
  btnDownload.download = opera.filename;

  // Fallback link
  document.getElementById('fallback-link').href = opera.pdf;

  // Load PDF
  const frame = document.getElementById('pdf-frame');
  frame.src = opera.pdf;
  frame.addEventListener('error', function() {
    frame.style.display = 'none';
    document.getElementById('pdf-fallback').style.display = 'block';
  });
})();
</script>

</body>
</html>
