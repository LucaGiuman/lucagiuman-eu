<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Leggi — Luca Giuman</title>
  <meta name="description" id="page-desc" content="Leggi l'opera di Luca Giuman.">
  <link rel="canonical" id="page-canonical" href="https://lucagiuman.eu/leggi.html">
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0a; color: #f0ece4; font-family: Inter, system-ui, sans-serif; }

    #reader-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: #111;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      gap: 1rem;
    }
    #reader-header .btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f0ece4;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #reader-header .btn:hover { background: rgba(255,255,255,0.13); }
    #reader-title {
      flex: 1;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.85;
    }

    #pdf-scroll {
      margin-top: 56px;
      min-height: calc(100vh - 56px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: #1a1a1a;
    }

    .pdf-page {
      display: block;
      max-width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    #pdf-status {
      color: rgba(240,236,228,0.5);
      font-size: 0.85rem;
      padding: 3rem 2rem;
      text-align: center;
    }

    #pdf-error {
      display: none;
      padding: 3rem 2rem;
      text-align: center;
      line-height: 1.7;
      color: rgba(240,236,228,0.6);
    }
    #pdf-error a { color: #f0ece4; }
  </style>
</head>
<body>

<header id="reader-header">
  <a id="btn-back" class="btn" href="/">← Opere</a>
  <span id="reader-title">Caricamento…</span>
  <a id="btn-download" class="btn" href="#" download>↓ Scarica</a>
</header>

<div id="pdf-scroll">
  <div id="pdf-status">Caricamento PDF…</div>
  <div id="pdf-error">
    <p>Il PDF non si carica.<br>
    <a id="fallback-link" href="#">Apri direttamente ↗</a></p>
  </div>
</div>

<script src="/assets/js/pdf.min.js"></script>
<script>
(function() {
  const opere = {
    'libro-versione-1': {
      pdf: '/pdf/libro-versione-1.pdf',
      titolo: 'Quando la tecnologia smette di essere uno strumento',
      filename: 'luca-giuman-quando-la-tecnologia.pdf'
    },
    'forza-ambiente-liberta': {
      pdf: '/pdf/forza-ambiente-liberta.pdf',
      titolo: 'Forza, Ambiente, Libertà',
      filename: 'luca-giuman-forza-ambiente-liberta.pdf'
    },
    'intervista-la-piazza-web': {
      pdf: '/pdf/intervista-la-piazza-web.pdf',
      titolo: 'Intervista · La Piazza Web',
      filename: 'luca-giuman-intervista-la-piazza-web.pdf'
    },
    'critto-fantasia': {
      pdf: '/pdf/critto-fantasia.pdf',
      titolo: 'Critto-fantasia — Etica dell’immaginare e architetture dell’oblio',
      filename: 'luca-giuman-critto-fantasia.pdf'
    }
  };

  const params = new URLSearchParams(location.search);
  const slug = params.get('opera');
  const opera = opere[slug];

  if (!opera) { location.href = '/'; return; }

  // Meta
  document.getElementById('page-title').textContent = opera.titolo + ' — Luca Giuman';
  document.getElementById('page-desc').content = opera.titolo + ' di Luca Giuman.';
  document.getElementById('reader-title').textContent = opera.titolo;

  // Back button
  document.getElementById('btn-back').addEventListener('click', function(e) {
    e.preventDefault();
    const ref = document.referrer;
    if (ref && new URL(ref).origin === location.origin) {
      history.back();
    } else {
      location.href = '/#opere';
    }
  });

  // Download — su iOS Safari ignora l'attributo download e naviga via;
  // usiamo window.open() che apre Safari fuori dalla PWA lasciandola intatta
  const btnDownload = document.getElementById('btn-download');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    btnDownload.addEventListener('click', function(e) {
      e.preventDefault();
      window.open(opera.pdf, '_blank', 'noopener');
    });
  } else {
    btnDownload.href = opera.pdf;
    btnDownload.download = opera.filename;
  }

  // Fallback
  document.getElementById('fallback-link').href = opera.pdf;

  // PDF.js
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/js/pdf.worker.min.js';

  const scroll = document.getElementById('pdf-scroll');
  const status = document.getElementById('pdf-status');

  pdfjsLib.getDocument(opera.pdf).promise.then(function(pdf) {
    status.remove();
    const total = pdf.numPages;

    // Calcola larghezza disponibile
    const maxW = Math.min(scroll.clientWidth - 24, 900);

    function renderPage(n) {
      return pdf.getPage(n).then(function(page) {
        const viewport = page.getViewport({ scale: 1 });
        const scale = maxW / viewport.width;
        const scaled = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.width = scaled.width;
        canvas.height = scaled.height;
        scroll.appendChild(canvas);

        return page.render({
          canvasContext: canvas.getContext('2d'),
          viewport: scaled
        }).promise;
      });
    }

    // Renderizza pagine in sequenza
    (function renderNext(n) {
      if (n > total) return;
      renderPage(n).then(function() { renderNext(n + 1); });
    })(1);

  }).catch(function() {
    status.style.display = 'none';
    document.getElementById('pdf-error').style.display = 'block';
  });
})();
</script>

</body>
</html>
